<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Answer Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF9F4;
    --paper-edge: #EFEAE0;
    --ink: #1C2541;
    --ink-soft: #5B6478;
    --pen: #C1440E;
    --pen-soft: #F3E4DA;
    --human: #2F6B4F;
    --human-soft: #E3EEE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .sheet {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    padding: 48px 44px;
    box-shadow: 0 1px 3px rgba(28,37,65,0.06);
  }
  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    border: 1px solid var(--paper-edge);
    border-radius: 4px;
    background: var(--paper);
    resize: vertical;
  }
  textarea:focus {
    outline: none;
    border-color: var(--ink-soft);
  }
  .char-count {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 6px;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #10182c; }

  .verdict {
    margin-top: 32px;
    padding: 24px;
    border-radius: 4px;
    border: 2px solid var(--pen);
    background: var(--pen-soft);
    transform: rotate(-1deg);
  }
  .verdict.human {
    border-color: var(--human);
    background: var(--human-soft);
  }
  .verdict-label {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--pen);
  }
  .verdict.human .verdict-label { color: var(--human); }
  .verdict-confidence {
    margin-top: 4px;
    font-size: 14px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="sheet">
  <a href="/about" style="float:right; font-size:13px; color:var(--ink-soft); text-decoration:none;">About →</a>

  <p class="subtitle"></p>
  
    <h1>AI Answer Detector</h1>
    <p class="subtitle">Paste a written answer below. The model estimates whether it reads as human-written or AI-generated, based on linguistic patterns — not proof of authorship.</p>

    <form action="/predict" method="POST">
      <textarea name="essay" placeholder="Paste the answer here…" required>{{ request.form.get('essay', '') }}</textarea>
      <button type="submit">Check Answer</button>
    </form>

    {% if prediction %}
    <div class="verdict {{ 'human' if prediction == 'Human-Written' else '' }}">
      <div class="verdict-label">{{ prediction }}</div>
      <div class="verdict-confidence">Model confidence: {{ confidence }}%</div>
    </div>
    {% endif %}
  </div>
</body>
</html>
